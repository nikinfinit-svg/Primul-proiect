<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portar Handbal</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #18202a;
    --muted: #6b7684;
    --line: #dde2e8;
    --accent: #1f6feb;
    --red: #ff3b30;
    --yellow: #ffcc00;
    --green: #34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: #2a313b;
      --accent: #4c8dff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { margin: 0; font-size: 1.4rem; }
  h2 { margin: 0 0 8px; font-size: 1.05rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .btn {
    padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-weight: 600;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text], select {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > * { flex: 1; }

  /* ---------- Lista de jucători ---------- */
  .player {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: var(--text); text-align: left;
  }
  .player:last-child { border-bottom: 0; }
  .player .info { flex: 1; min-width: 0; }
  .player .name { font-weight: 700; }
  .mini {
    flex: none; width: 54px; height: 36px; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px;
    background: #05080c; border: 3px solid #d0362f; border-bottom: 0; border-radius: 3px 3px 0 0;
  }
  .mini span { border-radius: 2px; background: #1a222c; }

  /* ---------- Poarta electronică ---------- */
  .goal-wrap { margin-top: 12px; }
  .goal {
    position: relative; aspect-ratio: 3 / 2; width: 100%;
    padding: 8px; display: grid; gap: 6px;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: #05080c;
    border: 12px solid; border-bottom: 0;
    border-image: repeating-linear-gradient(90deg, #d0362f 0 22px, #f4f4f4 22px 44px) 12;
    box-shadow: inset 0 0 30px #000;
  }
  .goal .cell {
    border: 1px solid #1f2a36; border-radius: 8px; background: #111820;
    color: #5d6b7a; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    transition: background .15s, box-shadow .15s, transform .08s;
  }
  .goal .cell:active { transform: scale(.96); }
  .goal .cell .n { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  .goal .cell .p { font-size: .75rem; opacity: .85; margin-top: 2px; }
  .goal .cell.red    { background: var(--red);    color: #fff; box-shadow: 0 0 18px var(--red); }
  .goal .cell.yellow { background: var(--yellow); color: #1b1b1b; box-shadow: 0 0 16px var(--yellow); }
  .goal .cell.green  { background: var(--green);  color: #08210f; box-shadow: 0 0 14px var(--green); }
  .goal .cell.ping { animation: ping .35s ease-out; }
  @keyframes ping { from { box-shadow: 0 0 0 0 #fff; } to { box-shadow: 0 0 0 14px transparent; } }
  .floor { height: 6px; background: #6b7684; border-radius: 0 0 4px 4px; }
  .sides { display: flex; justify-content: space-between; margin-top: 4px; font-size: .78rem; color: var(--muted); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .title { flex: 1; min-width: 0; }
  .total { font-size: 1.8rem; font-weight: 800; text-align: right; line-height: 1; }
  .total small { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); }

  .tips { margin: 0; padding-left: 20px; }
  .tips li { margin-bottom: 8px; }
  .stance {
    display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); margin-bottom: 12px;
  }
  .stance svg { flex: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== ECRAN 1: JUCĂTORI ===== -->
  <section id="screenList">
    <h1>🧤 Portar Handbal</h1>
    <div class="muted">Adaugă jucătorii adversari și notează unde aruncă</div>

    <div class="card">
      <h2>Jucător nou</h2>
      <input type="text" id="newName" placeholder="Nume (ex: Popescu 7)" maxlength="40">
      <div class="row">
        <select id="newPost"></select>
        <button class="btn primary" id="btnAdd" style="flex:none">＋ Adaugă</button>
      </div>
    </div>

    <div class="card">
      <h2>Jucători</h2>
      <div id="playerList"></div>
    </div>
  </section>

  <!-- ===== ECRAN 2: POARTA UNUI JUCĂTOR ===== -->
  <section id="screenPlayer" hidden>
    <div class="topbar">
      <button class="btn" id="btnBack">← Înapoi</button>
      <div class="title">
        <div style="font-weight:800;font-size:1.15rem" id="pName"></div>
        <select id="pPost" style="padding:6px 8px;margin-top:4px;width:auto"></select>
      </div>
      <div class="total"><span id="pTotal">0</span><small>șuturi</small></div>
    </div>

    <div class="card">
      <div class="muted">Apasă pe zona din poartă unde a aruncat jucătorul</div>
      <div class="goal-wrap">
        <div class="goal" id="goal"></div>
        <div class="floor"></div>
        <div class="sides"><span id="sideL"></span><span id="sideR"></span></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--red)"></i>aruncă cel mai des</span>
        <span><i style="background:var(--yellow)"></i>des</span>
        <span><i style="background:var(--green)"></i>rar</span>
      </div>
      <div class="row">
        <button class="btn" id="btnUndo">↩ Anulează</button>
        <button class="btn" id="btnFlip">⇄ Întoarce poarta</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Cum să stai</h2>
      <div id="advice"></div>
    </div>

    <div class="row">
      <button class="btn" id="btnReset">Șterge șuturile</button>
      <button class="btn" id="btnDelete" style="color:var(--red)">Șterge jucătorul</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
// Zonele sunt numerotate 0–8 ca poarta văzută DE PE TEREN (cum o vede aruncătorul):
// 0 1 2 / 3 4 5 / 6 7 8. Coloana 0 de pe teren = partea DREAPTĂ a portarului.
const ROWS = ["sus", "la mijloc", "jos"];
const GK_SIDE = ["în dreapta ta", "pe centru", "în stânga ta"];   // din perspectiva portarului

const POSTS = {
  "extrema-stanga": "Extremă stânga",
  "extrema-dreapta": "Extremă dreapta",
  "inter-stanga": "Inter stânga",
  "inter-dreapta": "Inter dreapta",
  "centru": "Centru",
  "pivot": "Pivot",
};

// Sfaturi de bază pentru fiecare post (din perspectiva portarului)
const POST_ADVICE = {
  "extrema-stanga": {
    stance: "Lipit de bara din dreapta ta",
    tips: [
      "Extrema stângă atacă din partea ta dreaptă. Stai cu umărul aproape de bara din dreapta ca să închizi colțul scurt.",
      "Când sare, fă un pas în întâmpinarea lui. Cu cât ieși mai mult, cu atât îi rămâne mai puțină poartă.",
      "Ține brațul dinspre bară sus și piciorul dinspre bară întins spre colțul de jos. Cealaltă mână rămâne pregătită pentru colțul lung.",
    ],
  },
  "extrema-dreapta": {
    stance: "Lipit de bara din stânga ta",
    tips: [
      "Extrema dreaptă atacă din partea ta stângă. Stai cu umărul aproape de bara din stânga ca să închizi colțul scurt.",
      "Când sare, fă un pas în întâmpinarea lui. Cu cât ieși mai mult, cu atât îi rămâne mai puțină poartă.",
      "Ține brațul dinspre bară sus și piciorul dinspre bară întins spre colțul de jos. Cealaltă mână rămâne pregătită pentru colțul lung.",
    ],
  },
  "inter-stanga": {
    stance: "Ușor spre dreapta ta, la ~1 m în fața porții",
    tips: [
      "Interul stâng aruncă de la 9 m, din partea ta dreaptă. Stai pe linia dintre minge și mijlocul porții.",
      "Poziția de bază: picioarele la lățimea umerilor, genunchii ușor îndoiți, greutatea pe vârfuri și mâinile sus, lângă cap.",
      "Urmărește brațul de aruncare, nu ochii lui. Fii atent și la șuturile jos, printre picioarele apărătorilor.",
    ],
  },
  "inter-dreapta": {
    stance: "Ușor spre stânga ta, la ~1 m în fața porții",
    tips: [
      "Interul drept aruncă de la 9 m, din partea ta stângă. Stai pe linia dintre minge și mijlocul porții.",
      "Poziția de bază: picioarele la lățimea umerilor, genunchii ușor îndoiți, greutatea pe vârfuri și mâinile sus, lângă cap.",
      "Urmărește brațul de aruncare, nu ochii lui. Fii atent și la șuturile jos, printre picioarele apărătorilor.",
    ],
  },
  "centru": {
    stance: "Pe mijlocul porții, puțin ieșit în față",
    tips: [
      "Centrul poate arunca de la distanță sau poate pasa la pivot ori la extreme. Stai echilibrat, în mijloc.",
      "Nu te arunca primul. Așteaptă să plece mingea din mână, mai ales când trage printre apărători.",
      "Dacă pasează, mută-te repede spre noua poziție a mingii, cu pași mici, laterali.",
    ],
  },
  "pivot": {
    stance: "Ieși spre el și fă-te cât mai mare",
    tips: [
      "Pivotul aruncă de foarte aproape, de la 6 m. Ieși spre el ca să-i micșorezi unghiul.",
      "Fă-te mare: brațele și picioarele deschise, ca un X. Așa acoperi cât mai multă poartă.",
      "Reacționează cât mai târziu. Pivotul te fentează des, așa că nu cădea primul.",
    ],
  },
};

// ---------- Stocare ----------
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
};

let players = store.get("portar.players", []);
let flipped = store.get("portar.flipped", false);   // false = văzută de pe teren
let currentId = null;

const $ = id => document.getElementById(id);
const save = () => store.set("portar.players", players);
const current = () => players.find(p => p.id === currentId);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1300);
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fillPostSelect(sel) {
  sel.innerHTML = Object.entries(POSTS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
}

// ---------- Culori: roșu / galben / verde după frecvență ----------
function counts(shots) {
  const c = Array(9).fill(0);
  shots.forEach(z => c[z]++);
  return c;
}

function heatClass(n, max) {
  if (!n) return "";
  const r = n / max;
  if (r >= 0.67) return "red";
  if (r >= 0.34) return "yellow";
  return "green";
}

const MINI_COLORS = { red: "#ff3b30", yellow: "#ffcc00", green: "#34c759" };

// ---------- Ecran: lista de jucători ----------
function renderList() {
  const list = $("playerList");
  if (!players.length) {
    list.innerHTML = `<div class="muted">Niciun jucător încă. Adaugă primul jucător mai sus.</div>`;
    return;
  }
  list.innerHTML = "";
  players.forEach(p => {
    const c = counts(p.shots);
    const max = Math.max(...c);
    const btn = document.createElement("button");
    btn.className = "player";
    btn.innerHTML = `
      <div class="mini">${c.map((n, i) => {
        const col = MINI_COLORS[heatClass(c[displayToZone(i)], max)];
        return `<span${col ? ` style="background:${col}"` : ""}></span>`;
      }).join("")}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="muted">${POSTS[p.post]} · ${p.shots.length} șuturi</div>
      </div>
      <span class="muted">›</span>`;
    btn.addEventListener("click", () => openPlayer(p.id));
    list.appendChild(btn);
  });
}

function addPlayer() {
  const name = $("newName").value.trim();
  if (!name) { $("newName").focus(); toast("Scrie numele jucătorului"); return; }
  const p = { id: Date.now(), name, post: $("newPost").value, shots: [] };
  players.push(p);
  save();
  $("newName").value = "";
  renderList();
  openPlayer(p.id);
}

$("btnAdd").addEventListener("click", addPlayer);
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });

// ---------- Ecran: poarta jucătorului ----------
// Când poarta e întoarsă (văzută din perspectiva portarului), coloanele se inversează.
function displayToZone(i) {
  if (!flipped) return i;
  const row = Math.floor(i / 3), col = i % 3;
  return row * 3 + (2 - col);
}

function openPlayer(id) {
  currentId = id;
  $("screenList").hidden = true;
  $("screenPlayer").hidden = false;
  window.scrollTo(0, 0);
  renderPlayer();
}

function closePlayer() {
  currentId = null;
  $("screenPlayer").hidden = true;
  $("screenList").hidden = false;
  renderList();
}

function renderPlayer(pingZone = null) {
  const p = current();
  if (!p) return closePlayer();
  $("pName").textContent = p.name;
  $("pPost").value = p.post;
  $("pTotal").textContent = p.shots.length;
  $("sideL").textContent = flipped ? "← stânga ta" : "← dreapta ta (portar)";
  $("sideR").textContent = flipped ? "dreapta ta →" : "stânga ta (portar) →";
  $("btnUndo").disabled = !p.shots.length;

  const c = counts(p.shots);
  const max = Math.max(...c);
  const total = p.shots.length;
  const goal = $("goal");
  goal.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const z = displayToZone(i);
    const n = c[z];
    const cell = document.createElement("button");
    cell.className = "cell " + heatClass(n, max) + (z === pingZone ? " ping" : "");
    cell.innerHTML = n
      ? `<span class="n">${n}</span><span class="p">${Math.round(n / total * 100)}%</span>`
      : `<span class="n" style="opacity:.25">0</span>`;
    cell.addEventListener("click", () => addShot(z));
    goal.appendChild(cell);
  }
  renderAdvice(p);
}

function addShot(z) {
  const p = current();
  p.shots.push(z);
  save();
  if (navigator.vibrate) navigator.vibrate(25);
  renderPlayer(z);
}

$("btnBack").addEventListener("click", closePlayer);
$("btnUndo").addEventListener("click", () => {
  const p = current();
  if (!p.shots.length) return;
  p.shots.pop();
  save();
  toast("Ultimul șut a fost șters");
  renderPlayer();
});
$("btnFlip").addEventListener("click", () => {
  flipped = !flipped;
  store.set("portar.flipped", flipped);
  toast(flipped ? "Poarta văzută din spatele tău (portar)" : "Poarta văzută de pe teren");
  renderPlayer();
});
$("pPost").addEventListener("change", e => {
  current().post = e.target.value;
  save();
  renderPlayer();
});
$("btnReset").addEventListener("click", () => {
  const p = current();
  if (!p.shots.length || !confirm(`Ștergi toate șuturile lui ${p.name}?`)) return;
  p.shots = [];
  save();
  renderPlayer();
});
$("btnDelete").addEventListener("click", () => {
  const p = current();
  if (!confirm(`Ștergi jucătorul ${p.name}?`)) return;
  players = players.filter(x => x.id !== p.id);
  save();
  closePlayer();
});

// ---------- Recomandări ----------
function zoneName(z) {
  const row = Math.floor(z / 3), col = z % 3;
  if (row === 1 && col === 1) return "pe centru, la mijloc";
  return `${ROWS[row]} ${GK_SIDE[col]}`;
}

function stanceSvg(post) {
  // siluetă simplă: X pentru pivot, mâini sus pentru rest
  const x = post === "pivot";
  return `<svg width="44" height="54" viewBox="0 0 44 54" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <circle cx="22" cy="8" r="5"/>
    <path d="M22 13v18"/>
    ${x ? `<path d="M22 18L6 6M22 18l16-12"/><path d="M22 31L8 50M22 31l14 19"/>`
        : `<path d="M22 18L10 10l-2-6M22 18l12-8 2-6"/><path d="M22 31l-9 8v11M22 31l9 8v11"/>`}
  </svg>`;
}

function renderAdvice(p) {
  const base = POST_ADVICE[p.post];
  const tips = [...base.tips];
  const total = p.shots.length;
  const c = counts(p.shots);
  const extra = [];

  if (total < 3) {
    extra.push(`Notează cel puțin 3 șuturi ca să primești sfaturi după unde aruncă ${escapeHtml(p.name)}.`);
  } else {
    // Zona preferată
    const max = Math.max(...c);
    const fav = c.map((n, z) => n === max ? z : -1).filter(z => z >= 0);
    extra.push(`<strong>Zona preferată:</strong> ${fav.map(zoneName).join(" și ")} (${max} din ${total} șuturi). Fii pregătit în primul rând pentru zona asta.`);

    // Sus / jos
    const sus = c[0] + c[1] + c[2], jos = c[6] + c[7] + c[8];
    if (sus / total >= 0.5) {
      extra.push("<strong>Aruncă mult sus.</strong> Ține mâinile sus, la nivelul capului. Nu te lăsa jos și nu îndoi prea mult genunchii.");
    } else if (jos / total >= 0.5) {
      extra.push("<strong>Aruncă mult jos.</strong> Coboară puțin centrul de greutate și ține mâinile la nivelul șoldului. Fii gata să aperi cu piciorul (fandare sau split).");
    } else {
      extra.push("Aruncă la fel de des sus și jos, deci rămâi în poziția de bază, echilibrat.");
    }

    // Stânga / dreapta (din perspectiva portarului); la extreme se ocupă sfatul de colț lung/scurt
    const gkRight = c[0] + c[3] + c[6], gkLeft = c[2] + c[5] + c[8];
    const wing = p.post.startsWith("extrema");
    if (wing) {
      // nimic aici
    } else if (gkRight / total >= 0.5 && gkRight >= 2 * gkLeft) {
      extra.push("<strong>Aruncă mai ales în partea ta dreaptă.</strong> Mută-te cu o jumătate de pas spre dreapta. Așa închizi colțul lui preferat și îl obligi să arunce unde îi place mai puțin.");
    } else if (gkLeft / total >= 0.5 && gkLeft >= 2 * gkRight) {
      extra.push("<strong>Aruncă mai ales în partea ta stângă.</strong> Mută-te cu o jumătate de pas spre stânga. Așa închizi colțul lui preferat și îl obligi să arunce unde îi place mai puțin.");
    }

    // Combinații cu postul
    if (wing) {
      // colțul lung pentru extrema stângă e în stânga portarului, pentru extrema dreaptă în dreapta
      const longSide = p.post === "extrema-stanga" ? gkLeft : gkRight;
      if (longSide / total >= 0.5) {
        extra.push("<strong>Extrema asta trage des în colțul lung.</strong> Nu te lipi complet de bară. Rămâi la o palmă de ea, cu greutatea pe piciorul dinspre centru.");
      } else {
        extra.push("<strong>Extrema asta trage des la colțul scurt.</strong> Rămâi lipit de bară și ține brațul dinspre bară foarte sus.");
      }
    }
    if (c[4] / total >= 0.3) {
      extra.push("<strong>Aruncă des pe centru,</strong> adesea pe lângă șold sau printre picioare. Ține picioarele apropiate și nu sări prea devreme.");
    }
  }

  $("advice").innerHTML = `
    <div class="stance">${stanceSvg(p.post)}<div><div class="muted">Poziție recomandată</div><strong>${base.stance}</strong></div></div>
    ${extra.length ? `<ul class="tips">${extra.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
    <div class="muted" style="margin:10px 0 6px">Pentru postul de ${POSTS[p.post].toLowerCase()}:</div>
    <ul class="tips">${tips.map(t => `<li>${t}</li>`).join("")}</ul>`;
}

// ---------- Start ----------
fillPostSelect($("newPost"));
fillPostSelect($("pPost"));
renderList();
</script>
