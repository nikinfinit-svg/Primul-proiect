<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaizen Zilnic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: o singură coloană îngustă — azi, ținta, cum stai, graficul. Fundal salvie mat, fără alb strălucitor. */
:root {
  --bg: #e3e8e1;
  --surface: #edf0ea;
  --ink: #2e3a34;
  --ink-2: #56635c;
  --muted: #7c8781;
  --line: #d2d9d0;
  --accent: #008570;
  --accent-soft: #d3e5dd;
  --kaizen: #bd6420;
  --match-soft: #efe2d2;
  --good: #2f7a4c;
  --bad: #ad4b3b;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b2220; --surface: #232b28; --ink: #dfe6e1; --ink-2: #b3beb8; --muted: #8a958f; --line: #333d39;
    --accent: #2a9c84; --accent-soft: #29403a; --kaizen: #c97330; --match-soft: #3a2f24; --good: #7cc896; --bad: #e59484; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2220; --surface: #232b28; --ink: #dfe6e1; --ink-2: #b3beb8; --muted: #8a958f; --line: #333d39;
  --accent: #2a9c84; --accent-soft: #29403a; --kaizen: #c97330; --match-soft: #3a2f24; --good: #7cc896; --bad: #e59484; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font); padding-inline: 16px; padding-block: 28px 64px; }
.wrap { max-width: 620px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2 { margin: 0; font-weight: 800; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 6vw, 2.2rem); letter-spacing: -0.01em; line-height: 1.1; }
h2 { font-size: 1.1rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 0.92rem; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.streak { text-align: center; background: var(--surface); border-radius: 14px; padding: 6px 14px; line-height: 1.15; }
.streak b { display: block; font-size: 1.4rem; color: var(--accent); }
.streak span { font-size: 0.75rem; color: var(--muted); }

.card { background: var(--surface); border-radius: var(--radius); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.banner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--ink-2); padding-inline: 4px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Azi */
form { display: grid; gap: 18px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-head input { border: 0; background: var(--bg); border-radius: 10px; padding: 5px 8px; color: var(--ink-2); font-size: 0.9rem; }
.q { display: grid; gap: 8px; }
.q > span { font-weight: 600; color: var(--ink-2); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper input { width: 84px; text-align: center; padding: 8px; border: 0; border-radius: 12px; background: var(--bg); font-size: 1.25rem; font-weight: 800; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--bg); font-size: 1.3rem; font-weight: 800; color: var(--ink-2); }
.round:hover { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--bg); border-radius: 99px; padding: 6px 14px; font-size: 0.95rem; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.minutes { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 0.95rem; }
.minutes input { width: 70px; padding: 5px 8px; border: 0; border-radius: 10px; background: var(--bg); text-align: center; }
.mood { display: flex; gap: 8px; }
.mood input { position: absolute; opacity: 0; pointer-events: none; }
.mood label { flex: 1; display: grid; place-items: center; height: 46px; border-radius: 12px; background: var(--bg); font-weight: 800; color: var(--ink-2); cursor: pointer; }
.mood input:checked + label { background: var(--accent); color: var(--surface); }
.mood input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.mood-scale { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); }
.save { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.primary { border: 0; border-radius: 12px; background: var(--accent); color: var(--surface); padding: 11px 22px; font-weight: 800; }
.primary:hover { filter: brightness(1.07); }
.saved { color: var(--good); font-size: 0.92rem; }

/* Program de meci */
.chip[data-w="Meci"] { font-weight: 800; }
.chip[data-w="Meci"][aria-pressed="true"] { background: var(--kaizen); }
.match { background: var(--match-soft); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.match-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.match-head b { font-size: 1.05rem; }
.match-head .num { color: var(--kaizen); font-weight: 800; }
.match-bar { height: 6px; border-radius: 99px; background: var(--surface); overflow: hidden; }
.match-bar i { display: block; height: 100%; background: var(--kaizen); border-radius: 99px; transition: width .3s ease; }
#match-steps { display: grid; gap: 14px; }
.phase { display: grid; gap: 6px; }
.phase h3 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 0.95rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--kaizen); }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.play { display: flex; gap: 6px; }
.play input { position: absolute; opacity: 0; pointer-events: none; }
.play label { flex: 1; display: grid; place-items: center; height: 40px; border-radius: 10px; background: var(--surface); font-weight: 800; color: var(--ink-2); cursor: pointer; }
.play input:checked + label { background: var(--kaizen); color: var(--surface); }
.play input:focus-visible + label { outline: 2px solid var(--kaizen); outline-offset: 2px; }
.goals-in { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 0.95rem; }
.goals-in input { width: 60px; padding: 5px 8px; border: 0; border-radius: 10px; background: var(--surface); text-align: center; }

/* Ținta */
.goals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.goal { background: var(--bg); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.goal b { font-size: 1.5rem; }
.goal .ok { color: var(--good); font-size: 0.85rem; font-weight: 600; }

/* Cum stai */
.tabs { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 7px 8px; font-weight: 600; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.lines li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.arrow { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--bg); color: var(--muted); }
.arrow.up { color: var(--good); }
.arrow.down { color: var(--bad); }

/* Grafic */
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chart-head select { border: 0; background: var(--bg); border-radius: 10px; padding: 6px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.85rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-bar { width: 10px; height: 12px; border-radius: 3px 3px 0 0; background: var(--accent); }
.key-line { width: 18px; height: 2px; border-radius: 2px; background: var(--kaizen); }
.chart-wrap { position: relative; }
#chart { display: block; width: 100%; height: auto; overflow: visible; }
#chart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 10px; border-radius: 10px; font-size: 0.85rem; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%); }

@media (max-width: 420px) {
  .goals { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Kaizen</h1>
      <p class="muted">1% mai bine în fiecare zi</p>
    </div>
    <div class="streak" title="Zile la rând cu jurnalul completat"><b class="num" id="streak">0</b><span>zile la rând</span></div>
  </header>

  <div class="banner" id="example-banner" hidden>
    <span>Vezi acum date de exemplu.</span>
    <button class="link-btn" id="clear-examples" type="button">Șterge-le și începe</button>
  </div>

  <section class="card" aria-labelledby="day-title">
    <form id="form" novalidate>
        <div class="card-head">
          <h2 id="day-title">Cum a fost ziua?</h2>
          <input type="date" id="date" aria-label="Ziua">
        </div>

        <div class="q">
          <span id="pages-label">Câte pagini ai citit?</span>
          <div class="stepper">
            <button class="round" type="button" data-step="-5" aria-label="Minus 5 pagini">−</button>
            <input id="pages" type="number" min="0" max="2000" inputmode="numeric" value="0" aria-labelledby="pages-label">
            <button class="round" type="button" data-step="5" aria-label="Plus 5 pagini">+</button>
          </div>
        </div>

        <div class="q">
          <span>Ce sport ai făcut?</span>
          <div class="chips" id="workouts"></div>
          <label class="minutes" for="minutes"><input id="minutes" type="number" min="0" max="600" inputmode="numeric" value="0"> minute</label>
        </div>

        <div class="match" id="match" hidden aria-labelledby="match-title">
          <div class="match-head">
            <b id="match-title">Program de meci</b>
            <span class="muted"><span class="num" id="match-count">0</span> pași bifați</span>
          </div>
          <div class="match-bar"><i id="match-bar" style="width:0"></i></div>
          <div id="match-steps"></div>
          <div class="phase">
            <h3 id="play-title">După meci: cum ai jucat?</h3>
            <div class="play" id="play" role="radiogroup" aria-labelledby="play-title"></div>
          </div>
          <label class="goals-in" for="match-goals">Goluri marcate <input id="match-goals" type="number" min="0" max="50" inputmode="numeric" value="0"></label>
        </div>

        <div class="q">
          <span>Cum te simți?</span>
          <div class="mood" id="mood"></div>
          <div class="mood-scale"><span>foarte rău</span><span>foarte bine</span></div>
        </div>

        <div class="save">
          <button class="primary" type="submit">Salvează</button>
          <span class="saved" id="saved" role="status"></span>
        </div>
    </form>
  </section>

  <section class="card" aria-labelledby="goal-title">
    <div>
      <h2 id="goal-title">Ținta de azi</h2>
      <p class="muted">Media ultimelor 7 zile, plus 1%.</p>
    </div>
    <div class="goals" id="goals"></div>
  </section>

  <section class="card" aria-labelledby="how-title">
    <h2 id="how-title">Cum stai</h2>
    <div class="tabs" role="tablist" aria-label="Perioada">
      <button type="button" role="tab" data-period="week" aria-selected="true">Săptămâna</button>
      <button type="button" role="tab" data-period="month" aria-selected="false">Luna</button>
      <button type="button" role="tab" data-period="year" aria-selected="false">Anul</button>
    </div>
    <ul class="lines" id="lines"></ul>
  </section>

  <section class="card" aria-labelledby="chart-title">
    <div class="chart-head">
      <h2 id="chart-title">Grafic</h2>
      <select id="metric" aria-label="Ce arată graficul">
        <option value="pages">Pagini</option>
        <option value="minutes">Minute de mișcare</option>
        <option value="mood">Stare</option>
      </select>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" role="img" aria-labelledby="chart-title"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
  </section>
</div>

<script>
(function () {
  var KEY = "kaizen-v1";
  var WORKOUTS = ["Handbal", "Meci", "Alergare", "Sală", "Acasă", "Yoga", "Plimbare", "Altul"];
  // Programul pentru ziua de meci: pregătire, încălzire, în timpul meciului, refacere
  var MATCH_PLAN = [
    { title: "Înainte de meci", steps: [
      ["somn", "Am dormit 7–9 ore"],
      ["masa", "Masă cu carbohidrați cu 3–4 ore înainte (paste, orez, pui)"],
      ["apa", "Am băut o jumătate de litru de apă cu 2 ore înainte"],
      ["gustare", "Gustare ușoară cu o oră înainte (o banană)"],
      ["echipament", "Echipament gata: încălțări, apă, prosop"],
      ["focus", "Mi-am ales 2 lucruri pe care vreau să le fac bine azi"]
    ] },
    { title: "Încălzire, 20–25 de minute", steps: [
      ["alergare", "5 minute de alergare ușoară"],
      ["mobilitate", "Mobilitate: fandări, rotații de șold și de umeri"],
      ["sprint", "Accelerări scurte și schimbări de direcție"],
      ["pase", "Pase în doi, tot mai rapide"],
      ["aruncari", "Aruncări la poartă, de la ușor la tare"]
    ] },
    { title: "În timpul meciului", steps: [
      ["hidratare", "Apă la fiecare pauză"],
      ["comunicare", "Am vorbit cu echipa în apărare"]
    ] },
    { title: "După meci", steps: [
      ["revenire", "5–10 minute de alergare ușoară și stretching"],
      ["refacere", "Masă cu proteine în primele 2 ore"]
    ] }
  ];
  var MATCH_TOTAL = MATCH_PLAN.reduce(function (n, p) { return n + p.steps.length; }, 0);
  var MOODS = ["Foarte rău", "Rău", "Normal", "Bine", "Foarte bine"];
  var DAYS = ["luni", "marți", "miercuri", "joi", "vineri", "sâmbătă", "duminică"];
  var DAYS_SHORT = ["L", "Ma", "Mi", "J", "V", "S", "D"];
  var MONTHS = ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie", "august", "septembrie", "octombrie", "noiembrie", "decembrie"];
  var MONTHS_SHORT = ["ian", "feb", "mar", "apr", "mai", "iun", "iul", "aug", "sep", "oct", "noi", "dec"];
  var PERIODS = {
    week: { cur: "săptămâna aceasta", prev: "săptămâna trecută" },
    month: { cur: "luna aceasta", prev: "luna trecută" },
    year: { cur: "anul acesta", prev: "anul trecut" }
  };
  var METRICS = {
    pages: { unit: "pagini", get: function (e) { return e.pages; } },
    minutes: { unit: "minute", get: function (e) { return e.minutes || 0; } },
    mood: { unit: "din 5", get: function (e) { return e.mood || null; } }
  };

  var nf1 = new Intl.NumberFormat("ro-RO", { maximumFractionDigits: 1 });
  var nf0 = new Intl.NumberFormat("ro-RO", { maximumFractionDigits: 0 });
  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function dow(d) { return (d.getDay() + 6) % 7; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  // „20 de pagini”, dar „15 pagini”
  function de(n) { var r = n % 100; return (n >= 20 && (r === 0 || r >= 20)) ? "de " : ""; }
  function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var $ = function (id) { return document.getElementById(id); };

  // ---------- date ----------
  function sampleData() {
    var seed = 11;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var out = {}, span = 420;
    for (var i = span; i >= 1; i--) {
      var t = 1 - i / span;
      if (rnd() < 0.12) continue;
      var trained = rnd() < 0.35 + 0.35 * t;
      var mood = Math.round(2.5 + 1.7 * t + (rnd() - 0.5) * 2.2 + (trained ? 0.4 : 0));
      var day = addDays(today, -i), matchDay = dow(day) === 5;
      out[iso(day)] = {
        pages: Math.max(0, Math.round(6 + 16 * t + (rnd() - 0.5) * 14)),
        workouts: matchDay ? ["Meci"] : trained ? [["Handbal", "Handbal", "Alergare", "Sală"][Math.floor(rnd() * 4)]] : [],
        minutes: matchDay ? 60 : trained ? 20 + Math.round(rnd() * 8) * 5 : 0,
        mood: Math.min(5, Math.max(1, mood)),
        example: true
      };
      if (matchDay) out[iso(day)].match = {
        done: ["somn", "masa", "apa", "echipament", "alergare", "mobilitate", "pase", "aruncari"].filter(function () { return rnd() < 0.5 + 0.4 * t; }),
        play: Math.min(5, Math.max(1, Math.round(2.6 + 1.6 * t + (rnd() - 0.5) * 2))),
        goals: Math.floor(rnd() * (2 + 4 * t))
      };
    }
    return out;
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return sampleData();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  var data = load();
  var view = { period: "week", metric: "pages" };

  // ---------- calcule ----------
  function range(kind, off) {
    var y = today.getFullYear(), m = today.getMonth(), s;
    if (kind === "week") { s = addDays(today, -dow(today) + 7 * off); return { s: s, e: addDays(s, 6) }; }
    if (kind === "month") return { s: new Date(y, m + off, 1), e: new Date(y, m + off + 1, 0) };
    return { s: new Date(y + off, 0, 1), e: new Date(y + off, 11, 31) };
  }
  function entriesBetween(a, b) {
    return Object.keys(data).filter(function (k) { return k >= a && k <= b; }).map(function (k) { return data[k]; });
  }
  function entriesIn(r) { return entriesBetween(iso(r.s), iso(r.e)); }
  function stats(list) {
    var moods = list.map(function (e) { return e.mood; }).filter(Boolean);
    var trained = list.filter(function (e) { return (e.minutes || 0) > 0 || (e.workouts && e.workouts.length); }).length;
    return {
      n: list.length,
      pagesAvg: avg(list.map(function (e) { return e.pages || 0; })),
      trained: trained,
      trainRate: list.length ? trained / list.length : null,
      moodN: moods.length,
      great: moods.filter(function (m) { return m === 5; }).length,
      greatRate: moods.length ? moods.filter(function (m) { return m === 5; }).length / moods.length : null
    };
  }
  function direction(cur, prev) {
    if (cur == null || prev == null) return "";
    if (Math.abs(cur - prev) < 1e-9) return "same";
    return cur > prev ? "up" : "down";
  }
  function matches(r) {
    var list = entriesIn(r).filter(function (e) { return e.match; });
    return {
      n: list.length,
      play: avg(list.map(function (e) { return e.match.play; }).filter(Boolean)),
      goals: list.reduce(function (g, e) { return g + (e.match.goals || 0); }, 0)
    };
  }
  function streak() {
    var d = data[iso(today)] ? today : addDays(today, -1), n = 0;
    while (data[iso(d)]) { n++; d = addDays(d, -1); }
    return n;
  }

  // ---------- formular ----------
  $("workouts").innerHTML = WORKOUTS.map(function (w) {
    return '<button type="button" class="chip" aria-pressed="false" data-w="' + w + '">' + w + "</button>";
  }).join("");
  $("mood").innerHTML = MOODS.map(function (m, i) {
    return '<input type="radio" name="mood" id="mood-' + (i + 1) + '" value="' + (i + 1) + '"><label for="mood-' + (i + 1) + '" title="' + m + '">' + (i + 1) + "</label>";
  }).join("");

  $("match-steps").innerHTML = MATCH_PLAN.map(function (p) {
    return '<div class="phase"><h3>' + p.title + "</h3>" + p.steps.map(function (st) {
      return '<label class="check" for="m-' + st[0] + '"><input type="checkbox" id="m-' + st[0] + '" data-step="' + st[0] + '"><span>' + st[1] + "</span></label>";
    }).join("") + "</div>";
  }).join("");
  $("play").innerHTML = [1, 2, 3, 4, 5].map(function (n) {
    return '<input type="radio" name="play" id="play-' + n + '" value="' + n + '"><label for="play-' + n + '">' + n + "</label>";
  }).join("");

  function isMatch() { return document.querySelector('#workouts .chip[data-w="Meci"]').getAttribute("aria-pressed") === "true"; }
  function updateMatch() {
    $("match").hidden = !isMatch();
    var n = document.querySelectorAll("#match-steps input:checked").length;
    $("match-count").textContent = n + " din " + MATCH_TOTAL;
    $("match-bar").style.width = (n / MATCH_TOTAL * 100) + "%";
  }

  function fillForm(k) {
    var e = data[k] || {};
    $("date").value = k;
    $("pages").value = e.pages || 0;
    $("minutes").value = e.minutes || 0;
    document.querySelectorAll("#workouts .chip").forEach(function (c) {
      c.setAttribute("aria-pressed", String((e.workouts || []).indexOf(c.dataset.w) >= 0));
    });
    document.querySelectorAll('input[name="mood"]').forEach(function (r) { r.checked = Number(r.value) === e.mood; });
    var m = e.match || {};
    document.querySelectorAll("#match-steps input").forEach(function (c) { c.checked = (m.done || []).indexOf(c.dataset.step) >= 0; });
    document.querySelectorAll('input[name="play"]').forEach(function (r) { r.checked = Number(r.value) === m.play; });
    $("match-goals").value = m.goals || 0;
    updateMatch();
    $("saved").textContent = "";
  }

  // ---------- randare ----------
  function renderGoals() {
    var last = entriesBetween(iso(addDays(today, -7)), iso(addDays(today, -1)));
    var e = data[iso(today)];
    if (!last.length) { $("goals").innerHTML = '<p class="muted">Completează câteva zile și aici apare ținta ta.</p>'; return; }
    var tp = Math.ceil(avg(last.map(function (x) { return x.pages || 0; })) * 1.01);
    var tm = Math.ceil(avg(last.map(function (x) { return x.minutes || 0; })) * 1.01);
    function goal(label, target, unit, done) {
      return '<div class="goal"><span class="muted">' + label + '</span><b class="num">' + nf0.format(target) + " " + de(target) + unit + "</b>" +
        (done ? '<span class="ok">✓ atinsă azi</span>' : "") + "</div>";
    }
    $("goals").innerHTML = goal("Citește", tp, "pagini", e && e.pages >= tp) + goal("Mișcă-te", tm, "minute", e && (e.minutes || 0) >= tm);
  }

  function renderLines() {
    var P = PERIODS[view.period];
    var cur = stats(entriesIn(range(view.period, 0))), prev = stats(entriesIn(range(view.period, -1)));
    var rows = [];
    if (cur.n) {
      rows.push([direction(cur.pagesAvg, prev.pagesAvg),
        "Citești în medie <b>" + nf1.format(cur.pagesAvg) + " pagini pe zi</b> " + P.cur + "." +
        (prev.n ? " " + cap(P.prev) + ": " + nf1.format(prev.pagesAvg) + "." : "")]);
      rows.push([direction(cur.trainRate, prev.trainRate),
        "Te-ai antrenat <b>" + cur.trained + " din " + cur.n + (cur.n === 1 ? " zi" : " zile") + "</b>." +
        (prev.n ? " " + cap(P.prev) + ": " + prev.trained + " din " + prev.n + "." : "")]);
    }
    var curM = matches(range(view.period, 0)), prevM = matches(range(view.period, -1));
    if (curM.n) {
      rows.push([direction(curM.play, prevM.play),
        "Ai jucat <b>" + (curM.n === 1 ? "un meci" : curM.n + " " + de(curM.n) + "meciuri") + "</b>" +
        (curM.play != null ? ", cu nota medie " + nf1.format(curM.play) + " din 5" : "") +
        (curM.goals ? " și ai marcat " + (curM.goals === 1 ? "un gol" : curM.goals + " " + de(curM.goals) + "goluri") : "") + "." +
        (prevM.play != null ? " " + cap(P.prev) + ": nota " + nf1.format(prevM.play) + "." : "")]);
    }
    if (cur.moodN) {
      rows.push([direction(cur.greatRate, prev.greatRate),
        "Te-ai simțit foarte bine <b>" + cur.great + " din " + cur.moodN + (cur.moodN === 1 ? " zi" : " zile") + "</b>." +
        (prev.moodN ? " " + cap(P.prev) + ": " + prev.great + " din " + prev.moodN + "." : "")]);
    }
    var sym = { up: "↑", down: "↓", same: "=", "": "·" };
    $("lines").innerHTML = rows.length ? rows.map(function (r) {
      return '<li><span class="arrow ' + r[0] + '" aria-label="' + ({ up: "în creștere", down: "în scădere", same: "la fel" }[r[0]] || "") + '">' + sym[r[0]] + "</span><span>" + r[1] + "</span></li>";
    }).join("") : '<li><span class="arrow">·</span><span class="muted">Încă nimic notat ' + P.cur + ".</span></li>";
  }

  function chartSeries() {
    var M = METRICS[view.metric], r = range(view.period, 0), pts = [];
    if (view.period === "year") {
      for (var m = 0; m < 12; m++) {
        var vals = entriesIn({ s: new Date(r.s.getFullYear(), m, 1), e: new Date(r.s.getFullYear(), m + 1, 0) }).map(M.get).filter(function (x) { return x != null; });
        pts.push({ label: MONTHS_SHORT[m], full: cap(MONTHS[m]) + " (medie)", value: avg(vals) });
      }
    } else {
      for (var d = new Date(r.s); d <= r.e; d = addDays(d, 1)) {
        var e = data[iso(d)];
        pts.push({ label: view.period === "week" ? DAYS_SHORT[dow(d)] : String(d.getDate()), full: cap(DAYS[dow(d)]) + ", " + d.getDate() + " " + MONTHS[d.getMonth()], value: e ? M.get(e) : null, future: d > today });
      }
    }
    // Drumul Kaizen: media perioadei trecute, plus 1% pe zi
    var kaizen = null;
    if (view.period !== "year" && view.metric !== "mood") {
      var base = avg(entriesIn(range(view.period, -1)).map(M.get).filter(function (x) { return x != null; }));
      if (base > 0) kaizen = pts.map(function (_, i) { return base * Math.pow(1.01, i + 1); });
    }
    return { pts: pts, kaizen: kaizen };
  }

  function renderChart() {
    var M = METRICS[view.metric], S = chartSeries(), pts = S.pts;
    var W = Math.max(260, $("chart-wrap").clientWidth), H = 220;
    var ml = 30, mr = 10, mt = 12, mb = 26, iw = W - ml - mr, ih = H - mt - mb, top, step;
    if (view.metric === "mood") { top = 5; step = 1; }
    else {
      var mx = Math.max.apply(null, pts.map(function (p) { return p.value || 0; }).concat(S.kaizen || [], [1])) * 1.08;
      var raw = mx / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
      step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag; top = Math.ceil(mx / step) * step;
    }
    function y(v) { return mt + ih - (v / top) * ih; }
    var band = iw / pts.length, bw = Math.max(3, Math.min(24, band * 0.6));
    function cx(i) { return ml + band * i + band / 2; }
    var svg = "";
    for (var t = 0; t <= top + 1e-9; t += step) {
      svg += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (ml - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + nf0.format(t) + "</text>";
    }
    var every = pts.length > 12 ? 5 : 1;
    pts.forEach(function (p, i) {
      if (pts.length <= 12 || (i + 1) % every === 0 || i === 0) {
        svg += '<text x="' + cx(i) + '" y="' + (H - 7) + '" text-anchor="middle">' + p.label + "</text>";
      }
      if (p.value != null && p.value > 0) {
        var x = cx(i) - bw / 2, yy = y(p.value), h = mt + ih - yy, r = Math.min(4, h, bw / 2);
        svg += '<path fill="var(--accent)" d="M' + x + "," + (yy + h) + "V" + (yy + r) + "Q" + x + "," + yy + " " + (x + r) + "," + yy +
          "H" + (x + bw - r) + "Q" + (x + bw) + "," + yy + " " + (x + bw) + "," + (yy + r) + "V" + (yy + h) + 'Z"/>';
      }
    });
    if (S.kaizen) {
      var li = S.kaizen.length - 1;
      svg += '<path d="' + S.kaizen.map(function (v, i) { return (i ? "L" : "M") + cx(i) + "," + y(v); }).join("") +
        '" fill="none" stroke="var(--kaizen)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
        '<circle cx="' + cx(li) + '" cy="' + y(S.kaizen[li]) + '" r="4" fill="var(--kaizen)" stroke="var(--surface)" stroke-width="2"/>';
    }
    var chart = $("chart");
    chart.setAttribute("viewBox", "0 0 " + W + " " + H);
    chart.innerHTML = svg;

    $("legend").innerHTML = '<span><i class="key-bar"></i>' + (view.period === "year" ? "Media lunii" : "Ziua ta") + "</span>" +
      (S.kaizen ? '<span><i class="key-line"></i>Ținta Kaizen (+1% pe zi)</span>' : "");

    chart.onpointermove = function (ev) {
      var rect = chart.getBoundingClientRect(), i = Math.floor(((ev.clientX - rect.left) * (W / rect.width) - ml) / band);
      var tip = $("tooltip");
      if (i < 0 || i >= pts.length) { tip.hidden = true; return; }
      var p = pts[i];
      tip.innerHTML = "<b>" + p.full + "</b><br>" + (p.value != null ? nf1.format(p.value) + " " + M.unit : (p.future ? "încă nu a venit" : "nenotat")) +
        (S.kaizen ? "<br>Ținta: " + nf1.format(S.kaizen[i]) : "");
      tip.hidden = false;
      var top2 = Math.max(p.value || 0, S.kaizen ? S.kaizen[i] : 0);
      tip.style.left = Math.min(Math.max(cx(i) * rect.width / W, 80), rect.width - 80) + "px";
      tip.style.top = (y(top2) * rect.height / H - 8) + "px";
    };
    chart.onpointerleave = function () { $("tooltip").hidden = true; };
  }

  function renderAll() {
    $("streak").textContent = streak();
    $("example-banner").hidden = !Object.keys(data).some(function (k) { return data[k].example; });
    renderGoals(); renderLines(); renderChart();
  }

  // ---------- evenimente ----------
  document.querySelectorAll(".round").forEach(function (b) {
    b.addEventListener("click", function () { $("pages").value = Math.max(0, (parseInt($("pages").value, 10) || 0) + Number(b.dataset.step)); });
  });
  $("workouts").addEventListener("click", function (e) {
    var c = e.target.closest(".chip"); if (c) { c.setAttribute("aria-pressed", String(c.getAttribute("aria-pressed") !== "true")); updateMatch(); }
  });
  $("match-steps").addEventListener("change", updateMatch);
  $("date").addEventListener("change", function () { if ($("date").value) fillForm($("date").value); });
  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var k = $("date").value || iso(today), mood = document.querySelector('input[name="mood"]:checked');
    data[k] = {
      pages: Math.max(0, parseInt($("pages").value, 10) || 0),
      workouts: Array.prototype.filter.call(document.querySelectorAll("#workouts .chip"), function (c) { return c.getAttribute("aria-pressed") === "true"; }).map(function (c) { return c.dataset.w; }),
      minutes: Math.max(0, parseInt($("minutes").value, 10) || 0),
      mood: mood ? Number(mood.value) : null
    };
    if (isMatch()) {
      var play = document.querySelector('input[name="play"]:checked');
      data[k].match = {
        done: Array.prototype.map.call(document.querySelectorAll("#match-steps input:checked"), function (c) { return c.dataset.step; }),
        play: play ? Number(play.value) : null,
        goals: Math.max(0, parseInt($("match-goals").value, 10) || 0)
      };
    }
    save(); renderAll();
    var d = parse(k);
    $("saved").textContent = k === iso(today) ? "Salvat. Bravo pentru azi!" : "Salvat pentru " + DAYS[dow(d)] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + ".";
  });
  $("clear-examples").addEventListener("click", function () {
    Object.keys(data).forEach(function (k) { if (data[k].example) delete data[k]; });
    save(); renderAll(); fillForm($("date").value || iso(today));
  });
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      view.period = b.dataset.period;
      document.querySelectorAll(".tabs button").forEach(function (o) { o.setAttribute("aria-selected", String(o === b)); });
      renderLines(); renderChart();
    });
  });
  $("metric").addEventListener("change", function () { view.metric = $("metric").value; renderChart(); });
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(renderChart, 120); });

  fillForm(iso(today));
  renderAll();
})();
</script>
</body>
</html>
